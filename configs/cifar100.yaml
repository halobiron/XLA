experiment:
  name: cifar100_full_tacs
  seed: 42
  mode: full_tacs
  deviations:
  - 30 epochs instead of paper 100
  - 224x224 images instead of paper 256x256
  - batch size 16 instead of paper classification batch size 64
  - fully frozen encoders instead of paper full classification fine-tuning
  - 16 sampled candidates per query for limited compute
  - horizontal pair RoPE layout is a project choice not specified by the paper
  - padded random crop and horizontal flip instead of paper random resized crop and horizontal/vertical flips

data:
  dataset: cifar100
  root: ./data
  # Set to false on Kaggle and point --data-root at an attached CIFAR-100 Dataset.
  download: false
  image_size: 224
  candidate_pool_ratio: 0.20
  candidates_per_query: 16
  validation_ratio: 0.10
  num_workers: 2

backbone:
  name: dinov3_vits16
  repo_dir: ./third_party/dinov3
  weights: ./checkpoints/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  freeze: true
  unfreeze_last_n_blocks: 0
  pair_rope_layout: horizontal

selector:
  projection: true
  tau: 0.1

policy:
  enabled: true
  lambda_policy: 1.0
  advantage_eps: 1.0e-6

topk:
  k: 2
  adaptive_threshold: 0.90

training:
  epochs: 30
  batch_size: 16
  optimizer: adamw
  lr_head: 3.0e-4
  lr_selector: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 0.05
  scheduler: cosine
  amp: true

evaluation:
  selection: argmax
  save_selected_pairs: true
  attention_visualization: false

output:
  root: ./outputs
