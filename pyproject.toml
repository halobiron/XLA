[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacsx"
version = "0.1.0"
description = "Mini reproduction and extension of Task-Aligned Context Selection"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pillow>=10.0",
    "gradio>=5.0",
]

[project.scripts]
tacsx-train = "tacsx.cli:main"
tacsx-summary = "tacsx.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
