experiment:
  name: cifar100_full_tacs
  seed: 42
  mode: full_tacs

data:
  dataset: cifar100
  root: ./data
  image_size: 224
  candidate_pool_ratio: 0.20
  candidates_per_query: 16
  num_workers: 4

backbone:
  name: dinov3_vits16
  repo_dir: ./third_party/dinov3
  weights: ./checkpoints/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  freeze: true
  unfreeze_last_n_blocks: 0

selector:
  projection: true
  tau: 0.1

policy:
  enabled: true
  lambda_policy: 1.0
  advantage_eps: 1.0e-6

topk:
  k: 2
  adaptive_threshold: 0.90

training:
  epochs: 30
  batch_size: 16
  optimizer: adamw
  lr_head: 3.0e-4
  lr_selector: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 0.05
  scheduler: cosine
  amp: true

evaluation:
  save_selected_pairs: true
  attention_visualization: false

output:
  root: ./outputs
